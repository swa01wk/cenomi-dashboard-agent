# In-container database URLs use host `db` and the same fake role passwords as `.env.example`
# (DEVENV §4). They are declared literally here — never ${DATABASE_URL_*} from the host shell.

x-cenomi-in-container-db-urls: &in-container-db-urls
  DATABASE_URL_ADMIN: postgresql://postgres:change-me-dev-only-admin@db:5432/postgres
  DATABASE_URL_OWNER: postgresql://cenomi_owner:change-me-dev-only-owner@db:5432/cenomi_dev
  DATABASE_URL_SEED: postgresql://cenomi_seed:change-me-dev-only-seed@db:5432/cenomi_dev
  DATABASE_URL_READER: postgresql://cenomi_reader:change-me-dev-only-reader@db:5432/cenomi_dev
  DATABASE_URL_APP: postgresql://cenomi_app:change-me-dev-only-app@db:5432/cenomi_dev

services:
  db:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-dev-only-admin
    volumes:
      - cenomi_pg:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["setup"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/app/backend/migrations:ro
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
    environment:
      <<: *in-container-db-urls
      CENOMI_ENV: dev
      DB: dev
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["setup"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_SEED: postgresql://cenomi_seed:change-me-dev-only-seed@db:5432/cenomi_dev
    command:
      [
        "python",
        "-c",
        "import sys; print('NOT_APPLICABLE: seed — active from M1'); sys.exit(0)",
      ]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CENOMI_ENV: dev
      DATABASE_URL_ADMIN: ""
      DATABASE_URL_OWNER: ""
      DATABASE_URL_SEED: ""
      DATABASE_URL_READER: postgresql://cenomi_reader:change-me-dev-only-reader@db:5432/cenomi_dev
      DATABASE_URL_APP: postgresql://cenomi_app:change-me-dev-only-app@db:5432/cenomi_dev
      API_INTERNAL_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/v1/health/live'', timeout=2)"',
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  otel:
    image: jaegertracing/all-in-one:1.64.0@sha256:7e9591218e7ddd51e568ef892e3ea190ae420ecf97c4d718910a3f57e076c216
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  cenomi_pg:
