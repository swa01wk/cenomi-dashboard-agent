name: milestone-gate

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: Milestone to gate (M0…M6)
        required: true
        type: string
      sha:
        description: Commit on main (default current branch SHA)
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate-ci:
    name: gate/ci
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.sha || github.sha }}

  gate-db-roundtrip:
    name: gate/db-roundtrip
    needs: [gate-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CENOMI_ENV: ci
      DB: test
      CONFIRM: "yes"
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL_OWNER: postgresql://cenomi_owner:change-me-dev-only-owner@localhost:5432/cenomi_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Migration round-trip
        run: |
          make db-init DB=test
          make db-upgrade DB=test
          make db-downgrade REV=base DB=test CONFIRM=yes
          make db-upgrade DB=test

  gate-specific:
    name: gate/specific
    needs: [gate-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Gate-mode checks
        run: |
          make specs-check GATE=${{ inputs.milestone }}
          make trace-report GATE=${{ inputs.milestone }}

  gate-report:
    name: gate/report
    needs: [gate-ci, gate-db-roundtrip, gate-specific]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Assemble report
        run: |
          MILESTONE="${{ inputs.milestone }}"
          SHA="${{ inputs.sha || github.sha }}"
          uv run --project backend python scripts/ci/gate_report.py \
            --milestone "$MILESTONE" \
            --sha "$SHA" \
            --output "tests/reports/gate/${MILESTONE}/report.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report-${{ inputs.milestone }}
          path: tests/reports/gate/**
          retention-days: 90
