[project]
name = "cenomi-backend"
version = "0.0.0"
description = "Cenomi Dashboard Intelligence Agent — backend workspace (package skeleton in M0-T03)"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.159",
  "uvicorn[standard]>=0.32,<0.35",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<0.60",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<0.60",
]

[dependency-groups]
dev = [
  "ruff>=0.8,<0.10",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.26",
  "pytest-xdist>=3.6,<4",
  "pytest-cov>=6.0,<7",
  "pytest-socket>=0.7,<0.8",
  "hypothesis>=6.122,<7",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
  "pip-audit>=2.7,<3",
]

[tool.uv]
required-version = ">=0.5.14"
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/tooling"]
pythonpath = ["."]
markers = [
  "trace: traceability marker (registered in M0-T11)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = []
exclude = [".*"]
