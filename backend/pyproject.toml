[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "cenomi-backend"
version = "0.0.0"
description = "Cenomi Dashboard Intelligence Agent — backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]

[project.scripts]
cenomi = "cenomi.cli.main:main"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "pytest-cov>=6.0",
  "pytest-socket>=0.7",
  "hypothesis>=6.122",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "pip-audit>=2.7",
]

[tool.uv]
required-version = "==0.13.5"
package = true
exclude-newer = "2026-10-09T00:00:00Z"
# CR-002 / DEF-0001 security patch (ADR-0003 §2, PYSEC-2026-4320); remove when exclude-newer passes this date
# CR-002 / DEF-0003 security patch (ADR-0003 §2, CVE-2026-112940, CVE-2026-112913, CVE-2026-112907); remove when exclude-newer passes this date
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z" }

[tool.uv.build-backend]
module-name = "cenomi"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S607", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "../scripts"]

[[tool.mypy.overrides]]
module = ["importlinter.*", "opentelemetry.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["doctor", "help_text", "report", "targets"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", ".."]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--disable-socket",
  "--allow-hosts=127.0.0.1,localhost,::1",
]
markers = [
  "unit: unit tests — no database or external network",
  "integration: integration tests against cenomi_test or the local stack",
  "db: database-focused tests",
  "contract: contract validation tests",
  "security: security and authorization tests",
  "agent_mock: agent tests with the mock provider (M3+)",
  "agent_replay: agent tests with the replay provider (M3+)",
  "agent_live: live-model agent tests (manual / eval-live only)",
  "slow: slow tests (may be deselected in fast CI)",
  "trace: acceptance-test traceability marker",
  "quarantine: flaky test quarantine (ARCH-R088)",
]
filterwarnings = [
  "error::pytest.PytestUnknownMarkWarning",
]
junit_family = "legacy"
