[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "cenomi-backend"
version = "0.0.0"
description = "Cenomi Dashboard Intelligence Agent — backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]

[project.scripts]
cenomi = "cenomi.cli.main:main"
lint-imports = "importlinter.cli:lint_imports_command"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "pytest-cov>=6.0",
  "pytest-socket>=0.7",
  "hypothesis>=6.122",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "pip-audit>=2.7",
  "types-pyyaml>=6.0",
]

[tool.uv]
required-version = "==0.13.5"
package = true
exclude-newer = "2026-10-09T00:00:00Z"

[tool.uv.build-backend]
module-name = "cenomi"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S607", "S603"]
"backend/tests/**" = ["S101", "S607", "S603"]
"scripts/lint/sql_safety.py" = ["EXE001"]
"scripts/make/*.py" = ["PERF402", "RUF100", "EXE001", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "../scripts"]

[[tool.mypy.overrides]]
module = ["importlinter.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["doctor", "help_text", "report", "targets"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "trace(at_id, reqs): traceability marker for acceptance tests",
]
